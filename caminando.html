<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sensor Ultrasonico ESP32</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      text-align: center;
      background-color: #0f172a;
      color: white;
    }

    h1 {
      margin-top: 40px;
      color: #38bdf8;
    }

    .card {
      margin: 40px auto;
      padding: 20px;
      background: #1e293b;
      border-radius: 12px;
      width: 250px;
    }

    .valor {
      font-size: 40px;
      margin-top: 10px;
    }

    /* CONTENEDOR DEL CAMINO */
    .escenario {
      width: 80%;
      height: 100px;
      margin: 40px auto;
      background: #334155;
      border-radius: 10px;
      position: relative;
      overflow: hidden;
    }

    /* PERSONA */
    .persona {
      position: absolute;
      bottom: 10px;
      left: 0;
      font-size: 40px;
      transition: left 0.5s ease;
    }

    /* TEXTO REFERENCIA */
    .labels {
      display: flex;
      justify-content: space-between;
      margin: 0 10%;
      font-size: 12px;
      color: #94a3b8;
    }

  </style>
</head>

<body>

  <h1>Distancia del Sensor</h1>

  <div class="card">
    <p>Distancia actual:</p>
    <div id="distancia" class="valor">-- cm</div>
  </div>

  <!-- ESCENARIO -->
  <div class="escenario">
    <div id="persona" class="persona">🚶‍♂️</div>
  </div>

  <div class="labels">
    <span>Cerca</span>
    <span>Lejos</span>
  </div>

  <script>
    const TOKEN = "22ccc844-7322-460a-8d08-5711bcc0b1ba";

    async function obtenerDatos() {
      try {
        const response = await fetch("https://api.tago.io/data?variable=distancia&query=last_value", {
          headers: {
            "Device-Token": TOKEN
          }
        });

        const data = await response.json();

        if (data.result.length > 0) {
          let distancia = data.result[0].value;

          document.getElementById("distancia").innerText = distancia + " cm";

          moverPersona(distancia);
        }

      } catch (error) {
        console.error("Error:", error);
      }
    }

    function moverPersona(distancia) {
      const persona = document.getElementById("persona");

      // Ajusta rango del sensor (ej: 0cm a 200cm)
      let maxDistancia = 200;

      // Convertimos distancia a porcentaje
      let porcentaje = (distancia / maxDistancia) * 100;

      if (porcentaje > 100) porcentaje = 100;
      if (porcentaje < 0) porcentaje = 0;

      persona.style.left = porcentaje + "%";
    }

    setInterval(obtenerDatos, 3000);
    obtenerDatos();
  </script>

</body>
</html>
